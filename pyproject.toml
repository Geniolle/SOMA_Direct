[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-direct"
version = "1.0.0"
description = "Motor HTTP direto e modular de alta velocidade para integracao com SOMA"
authors = [{ name = "Equipe SOMA" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "gspread>=6.0.0",
    "python-dotenv>=1.0.0",
    "urllib3>=2.0.0"
]

[project.scripts]
soma-direct = "main:main"
soma-reconcile = "workflows.reconciliation_cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "config*", "domain*", "services*", "workflows*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
